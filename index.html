<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KOKITO STAR ® System</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #020408;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --border-color: rgba(6, 182, 212, 0.3);
            
            --cyan: #06b6d4; --gold: #f59e0b; --purple: #d946ef; --green: #10b981; --white: #ffffff;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            margin: 0; padding: 20px; color: var(--white);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow-x: hidden;
        }

        #particle-canvas, #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
        #particle-canvas { z-index: -2; background: radial-gradient(circle at center, #0f172a 0%, #000000 100%); }
        #confetti-canvas { z-index: 2000; pointer-events: none; }

        .cyan-gradient-text {
            background: linear-gradient(135deg, #fff 20%, var(--cyan) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-color);
            width: 100%; max-width: 400px;
            border-radius: 30px; padding: 35px 30px;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8);
            display: flex; flex-direction: column; gap: 20px;
            position: relative; z-index: 10;
        }
        
        h1 { text-align: center; margin: 0; line-height: 1.1; }

        .brand-name {
            font-family: 'Rajdhani', sans-serif; display: block; font-size: 2.2rem; font-weight: 700; letter-spacing: 2px;
            background: linear-gradient(135deg, #fff 20%, var(--cyan) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(6, 182, 212, 0.5); text-transform: uppercase; margin-bottom: 5px;
        }
        .brand-sub { display: block; font-size: 0.7rem; color: rgba(255,255,255,0.6); letter-spacing: 3px; text-transform: uppercase; font-weight: 300; }
        .system-version { text-align: center; font-size: 0.65rem; color: var(--cyan); opacity: 0.8; letter-spacing: 1px; margin-bottom: 10px; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; }
        .kokito-bold { font-weight: 700; text-transform: uppercase; }
        
        /* CORRECCIÓN DE ALINEACIÓN (GRID) */
        .row { 
            display: grid; 
            grid-template-columns: 1fr 1fr; /* 50% exacto para cada uno */
            gap: 12px; /* Espacio limpio entre ambos */
            width: 100%; 
        }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; width: 100%; }

        label { 
            font-family: 'Rajdhani', sans-serif; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; 
            letter-spacing: 1px; color: var(--cyan); margin-left: 5px; opacity: 0.9;
        }
        
        input {
            /* Fix para iOS: Quitar apariencia nativa */
            -webkit-appearance: none; appearance: none;
            padding: 14px 5px; /* Padding ajustado para que quepa el texto */
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; color: #fff; font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; letter-spacing: 0.5px;
            width: 100%; box-sizing: border-box; outline: none; transition: all 0.3s ease; text-align: center;
            min-width: 0; /* Permite encogerse si es necesario */
        }
        input:focus { border-color: var(--cyan); background: rgba(6, 182, 212, 0.05); box-shadow: 0 0 25px rgba(6, 182, 212, 0.15); }
        
        /* BOTÓN PRINCIPAL */
        .btn-main {
            background: linear-gradient(90deg, var(--cyan), #2563EB);
            color: #fff; border: none; padding: 20px; border-radius: 18px;
            font-family: 'Montserrat', sans-serif; font-size: 1rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer; margin-top: 10px; width: 100%;
            box-shadow: 0 10px 30px rgba(6, 182, 212, 0.3); transition: all 0.2s; animation: heartbeat 2s infinite;
        }
        .btn-main:active { transform: scale(0.96); animation: none; }
        @keyframes heartbeat { 0%{transform:scale(1);box-shadow:0 0 0 0 rgba(6,182,212,0.4);} 70%{transform:scale(1.02);box-shadow:0 0 0 10px rgba(6,182,212,0);} 100%{transform:scale(1);box-shadow:0 0 0 0 rgba(6,182,212,0);} }

        /* BOTÓN LIMPIAR */
        .btn-clear {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
            padding: 12px; border-radius: 14px;
            font-family: 'Rajdhani', sans-serif; font-size: 0.85rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer; margin-top: 10px; width: 100%;
            transition: all 0.3s ease;
        }
        .btn-clear:hover, .btn-clear:active {
            border-color: rgba(255, 255, 255, 0.4);
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .results { margin-top: 25px; display: none; flex-direction: column; gap: 15px; }
        .card { padding: 18px 25px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); }
        .val { font-family: 'Rajdhani', sans-serif; font-size: 1.5rem; font-weight: 700; }
        .lbl { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; }
        .card-total { background: radial-gradient(circle at center, rgba(16, 185, 129, 0.1) 0%, rgba(0,0,0,0) 70%); border: 1px solid rgba(16, 185, 129, 0.3); flex-direction: column; text-align: center; padding: 30px 20px; }
        .total-val { font-family: 'Rajdhani', sans-serif; font-size: 3.5rem; font-weight: 700; color: #fff; margin: 5px 0; text-shadow: 0 0 30px var(--green); }
        .footer { margin-top: 20px; text-align: center; font-size: 0.65rem; color: rgba(255,255,255,0.3); letter-spacing: 1px; text-transform: uppercase; }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92); backdrop-filter: blur(12px); z-index: 1000;
            display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.4s ease;
        }
        .modal-content {
            background: rgba(10, 15, 30, 0.95); border: 2px solid var(--cyan);
            box-shadow: 0 0 50px rgba(6, 182, 212, 0.2); padding: 40px 30px; border-radius: 30px;
            text-align: center; max-width: 320px; width: 90%; transform: scale(0.8) translateY(20px);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; overflow: hidden;
        }
        .modal-content::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg); animation: shine 3s infinite;
        }
        @keyframes shine { 0% {transform:translateX(-100%) rotate(45deg);} 100% {transform:translateX(100%) rotate(45deg);} }
        .modal-icon { font-size: 3.5rem; margin-bottom: 10px; display: block; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-10px);} }
        .modal-title { font-family: 'Rajdhani', sans-serif; font-size: 1.6rem; font-weight: 700; margin: 0 0 15px 0; text-transform: uppercase; letter-spacing: 1px; }
        .modal-msg { color: #e0e7ff; font-size: 1rem; line-height: 1.6; margin-bottom: 25px; font-weight: 300; }
        .modal-msg strong { color: var(--gold); font-weight: 700; }
        .modal-amount-highlight { display: block; font-family: 'Rajdhani', sans-serif; font-size: 3rem; font-weight: 700; margin: 15px 0; filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.5)); }
        .btn-modal { position: relative; z-index: 2; background: linear-gradient(45deg, var(--cyan), #2563EB); color: #fff; margin-top: 0; padding: 15px; font-weight: 700; letter-spacing: 1px; border:none; border-radius:12px; width:100%; cursor:pointer; }
        .show-modal { opacity: 1; } .show-modal .modal-content { transform: scale(1) translateY(0); }
    </style>
</head>
<body>

<canvas id="particle-canvas"></canvas>
<canvas id="confetti-canvas"></canvas>

<div id="celebrationModal" class="modal-overlay">
    <div class="modal-content">
        <span class="modal-icon">✨</span>
        <h2 class="modal-title cyan-gradient-text">¡FELICIDADES!</h2>
        <p class="modal-msg" id="modalBodyText">Tu comisión de hoy fue de:</p>
        <span class="modal-amount-highlight cyan-gradient-text" id="modalAmountVal">$0</span>
        <button class="btn-modal" onclick="closeModal()">CONTINUAR</button>
    </div>
</div>

<div class="container">
    <h1>
        <span class="brand-name">KOKITO STAR ®</span>
        <span class="brand-sub">Calculadora de Honorarios</span>
    </h1>
    <div class="system-version">Sistema Pagos y Comisiones <span class="kokito-bold">KOKITO STAR ®</span> v2.0</div>

    <div class="row">
        <div class="input-group">
            <label>Entrada</label>
            <input type="time" id="start" value="12:00">
        </div>
        <div class="input-group">
            <label>Salida</label>
            <input type="time" id="end" value="20:00">
        </div>
    </div>

    <div class="input-group">
        <label>Tatuajes Realizados</label>
        <input type="number" id="tattoos" placeholder="0" inputmode="numeric">
    </div>

    <button type="button" class="btn-main" onclick="calculate()">Procesar Pago</button>
    
    <button type="button" class="btn-clear" onclick="clearForm()">Limpiar Datos</button>

    <div class="results" id="resultArea">
        <div class="card" style="border-left: 3px solid var(--cyan);">
            <span class="lbl">Pago Turno</span>
            <span class="val" id="basePay">$0</span>
        </div>
        <div class="card" style="border-left: 3px solid var(--purple);">
            <span class="lbl">Comisión</span>
            <span class="val" id="commPay">$0</span>
        </div>
        <div class="card card-total">
            <div class="lbl" style="color: var(--green); font-weight:bold;">PAGO DEL DÍA</div>
            <div class="total-val" id="totalPay">$0</div>
            <div style="font-size: 0.75rem; opacity: 0.6; letter-spacing: 1px; font-family: 'Rajdhani', sans-serif;" id="hoursText"></div>
        </div>
    </div>

    <div class="footer">
        Derechos Reservados © <span class="kokito-bold">KOKITO STAR ®</span>
    </div>
</div>

<script>
    // MENSAJES HUMANOS
    const mensajesHumanos = [
        "Hoy no solo hiciste tatuajes, regalaste sonrisas. ¡Gracias por tu magia!",
        "Tu esfuerzo de hoy ha dado grandes frutos. ¡Excelente trabajo!",
        "Eres pieza clave en Kokito Star. Gracias por brillar.",
        "Más que una comisión, es el resultado de tu pasión. ¡Disfrútalo!",
        "Tu talento hace este proyecto especial. Gracias por tu corazón.",
        "Cada niño atendido hoy es más feliz gracias a ti.",
        "Construyes tus sueños con tus propias manos. ¡Orgullo total!",
        "Tu energía es el motor de este equipo. ¡Gran día!",
        "Eres capaz de cosas increíbles. ¡Sigue así!",
        "Descansa con la satisfacción del deber cumplido."
    ];

    const format = (v) => Math.round(v).toLocaleString('es-CO', {style:'currency', currency:'COP', maximumFractionDigits:0});

    function calculate() {
        try {
            const startInput = document.getElementById('start').value;
            const endInput = document.getElementById('end').value;
            const tattoosInput = document.getElementById('tattoos').value;

            if (!startInput || !endInput) return alert("⚠️ Ingresa horas válidas.");

            const valorHora = 10000;
            let start = new Date(`2026-01-01T${startInput}:00`);
            let end = new Date(`2026-01-01T${endInput}:00`);
            if (end < start) end.setDate(end.getDate() + 1);

            const totalHours = Math.floor((end - start) / 60000) / 60;
            const pagoBase = totalHours * valorHora;

            let numTattoos = parseInt(tattoosInput) || 0;
            let comision = 0;

            if (numTattoos >= 30) comision += 10000;
            if (numTattoos >= 50) {
                comision += 20000;
                let extraSteps = Math.floor((numTattoos - 50) / 10);
                if (extraSteps > 0) comision += (extraSteps * 10000);
            }

            const totalPagar = pagoBase + comision;

            document.getElementById('basePay').innerText = format(pagoBase);
            document.getElementById('commPay').innerText = format(comision);
            document.getElementById('totalPay').innerText = format(totalPagar);
            document.getElementById('hoursText').innerText = `${totalHours.toFixed(2)} HRS • ${numTattoos} UNIDADES`;
            document.getElementById('resultArea').style.display = 'flex';

            if (comision > 0) showModal(comision);

        } catch (error) { alert(error.message); }
    }

    function clearForm() {
        document.getElementById('start').value = "12:00";
        document.getElementById('end').value = "20:00";
        document.getElementById('tattoos').value = "";
        document.getElementById('resultArea').style.display = 'none';
        if (navigator.vibrate) navigator.vibrate(50);
    }

    function showModal(amount) {
        const modal = document.getElementById('celebrationModal');
        document.getElementById('modalBodyText').innerText = mensajesHumanos[Math.floor(Math.random() * mensajesHumanos.length)];
        const amountElem = document.getElementById('modalAmountVal');
        amountElem.innerText = "$0"; 
        
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('show-modal'), 10);
        
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        triggerConfetti();
        animateValue(amountElem, 0, amount, 1500);
    }

    function animateValue(obj, start, end, duration) {
        let startTimestamp = null;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / duration, 1);
            const easeProgress = progress === 1 ? 1 : 1 - Math.pow(2, -10 * progress);
            const currentVal = Math.floor(easeProgress * (end - start) + start);
            obj.innerText = format(currentVal);
            if (progress < 1) window.requestAnimationFrame(step);
        };
        window.requestAnimationFrame(step);
    }

    function closeModal() {
        const modal = document.getElementById('celebrationModal');
        modal.classList.remove('show-modal');
        setTimeout(() => modal.style.display = 'none', 300);
    }

    // --- EFECTOS VISUALES ---
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    const confCanvas = document.getElementById('confetti-canvas');
    const confCtx = confCanvas.getContext('2d');
    
    let particles = []; let confetti = []; let confettiActive = false;

    function resize() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        confCanvas.width = window.innerWidth; confCanvas.height = window.innerHeight;
        initParticles();
    }
    window.addEventListener('resize', resize);

    function initParticles() {
        particles = [];
        let n = (canvas.width * canvas.height) / 9000;
        for (let i=0; i<n; i++) particles.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: Math.random()*2-1, vy: Math.random()*2-1, size: Math.random()*2+1 });
    }

    function animateBg() {
        ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = 'rgba(6, 182, 212, 1)';
        particles.forEach(p => {
            p.x += p.vx * 0.4; p.y += p.vy * 0.4;
            if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        });
        ctx.strokeStyle = 'rgba(6, 182, 212, 0.15)';
        for(let i=0; i<particles.length; i++){
            for(let j=i; j<particles.length; j++){
                let dx = particles[i].x - particles[j].x; let dy = particles[i].y - particles[j].y;
                if(dx*dx + dy*dy < 15000) { ctx.beginPath(); ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
            }
        }
        requestAnimationFrame(animateBg);
    }

    function triggerConfetti() {
        confetti = [];
        for(let i=0; i<150; i++) confetti.push({ x: confCanvas.width/2, y: confCanvas.height/2, vx: Math.random()*20-10, vy: Math.random()*20-15, size: Math.random()*10+5, color: Math.random()>0.5?'#06b6d4':'#f59e0b', gravity: 0.6 });
        confettiActive = true; animateConfetti();
        setTimeout(() => { confettiActive = false; confCtx.clearRect(0,0,confCanvas.width,confCanvas.height); }, 5000);
    }

    function animateConfetti() {
        if(!confettiActive) return;
        confCtx.clearRect(0,0,confCanvas.width,confCanvas.height);
        confetti.forEach(p => { p.vy += p.gravity; p.x += p.vx; p.y += p.vy; confCtx.fillStyle = p.color; confCtx.fillRect(p.x, p.y, p.size, p.size); });
        requestAnimationFrame(animateConfetti);
    }

    resize(); initParticles(); animateBg();
</script>
</body>
</html>
